# ===========================================
# Calricula - Production Docker Compose
# ===========================================
#
# Prerequisites:
#   1. Copy .env.production.example to .env and configure all variables
#   2. Set up a Logto tenant per docs/AUTH-LOGTO.md and set the OIDC_*/LOGTO_* variables
#   3. Set DOMAIN in .env to your domain (e.g., calricula.example.com)
#
# Usage:
#   Build:    docker compose -f docker-compose.prod.yml build
#   Start:    docker compose -f docker-compose.prod.yml up -d
#   Logs:     docker compose -f docker-compose.prod.yml logs -f
#   Stop:     docker compose -f docker-compose.prod.yml down
#
# First-time setup (reference data only -- seeds.seed_all also creates the
# dev test users and demo content and must not be run in production).
# seed_departments loads a reference division/department list that courses
# depend on; edit it for your college (backend/seeds/seed_departments.py) or
# maintain the tables directly afterwards:
#   docker compose -f docker-compose.prod.yml exec backend alembic upgrade head
#   docker compose -f docker-compose.prod.yml exec backend python -m seeds.seed_departments
#   docker compose -f docker-compose.prod.yml exec backend python -m seeds.seed_top_codes
#   docker compose -f docker-compose.prod.yml exec backend python -m seeds.seed_ccn_standards
#
# Estimated resources: 1-2 vCPU, 2GB RAM (light usage, ~25 users)

services:
  # ===========================================
  # Caddy Reverse Proxy (SSL + Load Balancing)
  # ===========================================
  caddy:
    image: caddy:2-alpine
    container_name: calricula-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      - DOMAIN=calricula.com
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/caddy-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================
  # PostgreSQL Database
  # ===========================================
  db:
    image: postgres:16-alpine
    container_name: calricula-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-calricula}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-calricula}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Database not exposed externally - only accessible within Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-calricula} -d ${DB_NAME:-calricula}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================
  # FastAPI Backend
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: calricula-backend-prod
    restart: unless-stopped
    environment:
      # Database
      - DATABASE_URL=postgresql://${DB_USER:-calricula}:${DB_PASSWORD}@db:5432/${DB_NAME:-calricula}
      # Google AI
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:?GOOGLE_API_KEY is required}
      - GEMINI_FILE_SEARCH_STORE_NAME=${GEMINI_FILE_SEARCH_STORE_NAME:-calricula-knowledge-base}
      # Logto / OIDC (ADR-0001) -- see docs/AUTH-LOGTO.md
      - OIDC_ISSUER=${OIDC_ISSUER:?OIDC_ISSUER is required}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:?OIDC_AUDIENCE is required}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:?OIDC_CLIENT_ID is required}
      - OIDC_JWKS_URL=${OIDC_JWKS_URL}
      - AUTH_LEGACY_RELINK=${AUTH_LEGACY_RELINK:-true}
      # Production settings
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      # Persistent storage for uploads
      - uploads_data:/app/uploads
    # Backend not exposed externally - Caddy proxies to it
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ===========================================
  # Next.js Frontend
  # ===========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # API URL should match your domain for client-side requests
        - NEXT_PUBLIC_API_URL=https://calricula.com
        # Advertise Logto sign-in to the browser; baked in at build time like
        # every other NEXT_PUBLIC_ variable.
        - NEXT_PUBLIC_LOGTO_ENABLED=${NEXT_PUBLIC_LOGTO_ENABLED:-false}
      # The frontend depends on the private package @johnnyrobot/workspace-ui
      # (GitHub Packages). The build reads a `read:packages` token from the
      # file named in NPM_TOKEN_FILE (default ./.npm_token, gitignored) as a
      # BuildKit secret; it is never stored in the image or in .env.
      # See docs/APPLICATIONX-EMBED.md "Installing the shared workspace package".
      secrets:
        - npm_token
    container_name: calricula-frontend-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Internal API URL for server-side requests
      - API_URL=http://backend:8000
      - API_BASE_URL=http://backend:8000
      # Logto (server-only; see docs/AUTH-LOGTO.md)
      - LOGTO_ENDPOINT=${LOGTO_ENDPOINT}
      - LOGTO_APP_ID=${LOGTO_APP_ID}
      - LOGTO_APP_SECRET=${LOGTO_APP_SECRET}
      - LOGTO_COOKIE_SECRET=${LOGTO_COOKIE_SECRET}
      - LOGTO_BASE_URL=${LOGTO_BASE_URL:-https://calricula.com}
      - LOGTO_API_RESOURCE=${LOGTO_API_RESOURCE}
      - LOGTO_APPLICATIONX_RESOURCE=${LOGTO_APPLICATIONX_RESOURCE}
    # Frontend not exposed externally - Caddy proxies to it
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

secrets:
  # Build-time only (frontend image). Put a GitHub token with `read:packages`
  # in ./.npm_token, or point NPM_TOKEN_FILE at another file.
  npm_token:
    file: ${NPM_TOKEN_FILE:-./.npm_token}

networks:
  default:
    name: calricula-network-prod
    driver: bridge
