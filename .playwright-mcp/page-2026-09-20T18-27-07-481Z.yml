        - paragraph [ref=f4e1916]:
          - text: Get data for individual postings that match your requested filters. Note that not all fields are present for all postings, and some may be
          - code [ref=f4e1917]: "null"
          - text: or
          - code [ref=f4e1918]: "\"Unknown\""
          - text: . The
          - code [ref=f4e1919]: url
          - text: field is only available for currently active postings, and the destination website is not guaranteed to be secure or functional.
        - paragraph [ref=f4e1920]:
          - text: Note that the
          - code [ref=f4e1921]: score
          - text: field is based on posting relevance to your query. Many fields have a single value per posting so relevance scores will be the same for all postings that match those filters. Score variance occurs when a filter is provided that can match a subset of the values in a particular field, filters such as
          - code [ref=f4e1922]: keyword
          - text: and
          - code [ref=f4e1923]: skills
          - text: provide such functionality. Only the first 200 values per filter will be used for relevance scoring.
        - paragraph [ref=f4e1924]:
