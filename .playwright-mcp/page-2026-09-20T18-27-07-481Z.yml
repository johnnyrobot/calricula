      - article [ref=f4e138]:
        - heading "Job Postings" [level=1] [ref=f4e139]:
          - link:
            - /url: "#job-postings"
          - text: Job Postings
          - generic: "⚠️ Maintainers: 🛠️ 🛠️ 🛠️ 🛠️ 🛠️"
        - heading "v2.97.0" [level=4] [ref=f4e140]:
          - link:
            - /url: "#v2-97-0"
          - text: v2.97.0
        - heading [level=5] [ref=f4e141]:
          - link:
            - /url: "#information-on-past-releases-can-be-found-in-the-changelog"
          - text: Information on past releases can be found in the
          - link "Changelog" [ref=f4e142] [cursor=pointer]:
            - /url: /updates/job-postings-api-changelog
          - text: .
        - blockquote [ref=f4e143]:
          - paragraph [ref=f4e144]:
            - strong [ref=f4e145]: "Note:"
            - text: By default, all clients are allowed the maximum of 10 requests per second. Contact us
            - link "here" [ref=f4e146] [cursor=pointer]:
              - /url: https://docs.lightcast.dev/contact
            - text: if you need an adjustment.
        - heading "Overview" [level=2] [ref=f4e147]:
          - link:
            - /url: "#overview"
          - text: Overview
        - heading "Use case" [level=3] [ref=f4e148]:
          - link:
            - /url: "#use-case"
          - text: Use case
        - paragraph [ref=f4e149]: This is an interface for retrieving job posting data that is filtered, sorted and ranked by various properties of the job postings.
        - heading "About the data" [level=3] [ref=f4e150]:
          - link:
            - /url: "#about-the-data"
          - text: About the data
        - paragraph [ref=f4e151]: Job postings are collected from various sources and processed/enriched to provide information such as standardized company name, occupation, skills, and geography.
        - heading "Content type" [level=3] [ref=f4e152]:
          - link:
            - /url: "#content-type"
          - text: Content type
        - paragraph [ref=f4e153]:
          - text: Unless otherwise noted, all requests that require a body accept
          - code [ref=f4e154]: application/json
          - text: . Likewise, all response bodies are
          - code [ref=f4e155]: application/json
          - text: .
        - heading "Authentication" [level=3] [ref=f4e156]:
          - link:
            - /url: "#authentication"
          - text: Authentication
        - paragraph [ref=f4e157]:
          - text: All endpoints require an OAuth bearer token. Tokens are granted through our Authentication API at
          - code [ref=f4e158]: https://auth.emsicloud.com/connect/token
          - text: and are valid for 1 hour. For access to the US Job Postings API, you must request an OAuth bearer token with the scope
          - code [ref=f4e159]: postings:us
          - text: .
        - generic [ref=f4e160]:
          - generic: curl
          - generic [ref=f4e161] [cursor=pointer]: Node
          - generic [ref=f4e162] [cursor=pointer]: Java
          - generic [ref=f4e163] [cursor=pointer]: C#
          - generic [ref=f4e164] [cursor=pointer]: C
          - generic [ref=f4e165] [cursor=pointer]: Python
          - generic [ref=f4e166] [cursor=pointer]: PHP
          - generic [ref=f4e167] [cursor=pointer]: R
          - generic [ref=f4e168] [cursor=pointer]: HTTPie
        - generic [ref=f4e171]:
          - code [ref=f4e173]: "curl --request POST \\ --url https://auth.emsicloud.com/connect/token \\ --header 'Content-Type: application/x-www-form-urlencoded' \\ --data client_id=CLIENT_ID \\ --data client_secret=CLIENT_SECRET \\ --data grant_type=client_credentials \\ --data scope=postings:us"
          - generic [ref=f4e174] [cursor=pointer]: COPY
        - paragraph [ref=f4e175]:
          - strong [ref=f4e176]: Response
        - generic [ref=f4e177]:
          - code [ref=f4e179]: "{ \"access_token\": \"<ACCESS_TOKEN>\", \"expires_in\": 3600, \"token_type\": \"Bearer\" }"
          - generic [ref=f4e180] [cursor=pointer]: COPY
        - paragraph [ref=f4e181]:
          - text: Issuing requests with the header
          - code [ref=f4e182]: "Authorization: Bearer <ACCESS_TOKEN>"
          - text: will grant you access to this API for the duration of the token. For continued access make sure to fetch a new token before time expires. See our
          - link "OAuth 2.0 guide" [ref=f4e183] [cursor=pointer]:
            - /url: /guides/oauth-2-0
          - text: for additional details.
        - heading "Filtering" [level=3] [ref=f4e184]:
          - link:
            - /url: "#filtering"
          - text: Filtering
        - paragraph [ref=f4e185]:
          - text: All data endpoints have an extensive filter request property allowing you to filter job postings down to specific subsets for analysis. The only required property of a filter is the
          - code [ref=f4e186]: when
          - text: field, which can either filter job posting results to currently active postings (defined by the string
          - code [ref=f4e187]: active
          - text: ), or a specified range of months/days (defined by an object with
          - code [ref=f4e188]: start
          - text: and
          - code [ref=f4e189]: end
          - text: dates). Available months and the latest available day can be found in the
          - link "/meta" [ref=f4e190] [cursor=pointer]:
            - /url: "#meta"
          - text: endpoint, along with a list of all of the available facets, filters, and metrics.
        - paragraph [ref=f4e191]:
          - text: Most filters are associated with a particular taxonomy and have both id filters and name filters. For instance, to filter by job title you may use the
          - code [ref=f4e192]: title
          - text: filter with job title codes or the
          - code [ref=f4e193]: title_name
          - text: filter with job title names. These filters require exact matches, including capitalization, punctuation, and whitespace, in order to work as expected. Supported codes and/or names can be found by performing a ranking along the filter's facet (see
          - link "/rankings" [ref=f4e194] [cursor=pointer]:
            - /url: "#rankings"
          - text: for more details) or by searching in one of the taxonomy endpoints (see
          - link "/taxonomies" [ref=f4e195] [cursor=pointer]:
            - /url: "#taxonomies"
          - text: ).
        - paragraph [ref=f4e196]: Each taxonomy filter has both a shorthand and a verbose syntax.
        - list [ref=f4e197]:
          - listitem [ref=f4e198]:
            - paragraph [ref=f4e199]:
              - strong [ref=f4e200]: Shorthand
              - text: ": a list of items."
            - generic [ref=f4e201]:
              - code [ref=f4e203]: "{ \"when\": { \"start\": \"2018-01\", \"end\": \"2018-06\" }, \"title_name\": [ \"Data Scientist\", \"Computer Scientist\" ] }"
              - generic [ref=f4e204] [cursor=pointer]: COPY
            - paragraph [ref=f4e205]: These filters match all job postings in the first 6 months of 2018 that include either one of the job titles "Data Scientist" or "Computer Scientist".
            - paragraph [ref=f4e206]: "This shorthand filter syntax is equivalent to the following in the verbose form:"
            - generic [ref=f4e207]:
              - code [ref=f4e209]: "{ \"when\": { \"start\": \"2018-01\", \"end\": \"2018-06\" }, \"title_name\": { \"include\": [ \"Data Scientist\", \"Computer Scientist\" ], \"include_op\": \"or\" } }"
              - generic [ref=f4e210] [cursor=pointer]: COPY
          - listitem [ref=f4e211]:
            - paragraph [ref=f4e212]:
              - strong [ref=f4e213]: Verbose
              - text: ": an object defining inclusive/exclusive items and optional operators defining how to match those items in a posting."
            - generic [ref=f4e214]:
              - code [ref=f4e216]: "{ \"when\": { \"start\": \"2018-01-01\", \"end\": \"2018-04-01\" }, \"skills_name\": { \"include\": [ \"SQL (Programming Language)\", \"C++ (Programming Language)\" ], \"include_op\": \"and\", \"exclude\": [ \"Java (Programming Language)\", \"C Sharp (Programming Language)\" ], \"exclude_op\": \"or\" } }"
              - generic [ref=f4e217] [cursor=pointer]: COPY
            - paragraph [ref=f4e218]: These filters match all job postings in the first 90 days of 2018 that mention both SQL and C++ skills while not mention Java or C# skills.
        - paragraph [ref=f4e219]:
          - strong [ref=f4e220]: "Note:"
          - text: The
          - code [ref=f4e221]: include_op
          - text: and
          - code [ref=f4e222]: exclude_op
          - text: fields apply to
          - code [ref=f4e223]: include
          - text: and
          - code [ref=f4e224]: exclude
          - text: fields respectively, they default to
          - code [ref=f4e225]: or
          - text: if unspecified.
        - list [ref=f4e226]:
          - listitem [ref=f4e227]:
            - paragraph [ref=f4e228]:
              - code [ref=f4e229]: and
              - text: – match job postings that include/exclude all items in the list
          - listitem [ref=f4e230]:
            - paragraph [ref=f4e231]:
              - code [ref=f4e232]: or
              - text: – match job postings that include/exclude any of the items in the list
            - paragraph [ref=f4e233]:
              - text: Combining multiple values in the
              - code [ref=f4e234]: include
              - text: /
              - code [ref=f4e235]: exclude
              - text: fields of a filter with an
              - code [ref=f4e236]: and
              - text: operator currently is only useful for filters that have multiple values per job posting (e.g., skills and education levels). Using this approach on filters that only have a single value per posting (i.e., company, occupation, job title, etc.) would always result in
              - code [ref=f4e237]: "0"
              - text: matching postings.
        - paragraph [ref=f4e238]: All filters applied to a request must be true for a job posting to be included in the response. See the "Full Reference" tab under each endpoint for the full listing of filters and metrics that can be applied to your requests.
        - heading "Glossary" [level=3] [ref=f4e239]:
          - link:
            - /url: "#glossary"
          - text: Glossary
        - blockquote [ref=f4e240]:
          - paragraph [ref=f4e241]:
            - strong [ref=f4e242]: Note
            - text: ": For performance reasons, some metrics may be approximations."
        - paragraph [ref=f4e243]: The job posting metrics available in this API are listed below.
        - paragraph [ref=f4e244]:
          - emphasis [ref=f4e245]:
            - text: Note that
            - code [ref=f4e246]: salary
            - text: is defined as the average of all advertised salaries listed in a job posting.
        - table [ref=f4e247]:
          - rowgroup [ref=f4e248]:
            - row [ref=f4e249]:
              - columnheader "Metric" [ref=f4e250]
              - columnheader "Definition" [ref=f4e251]
          - rowgroup [ref=f4e252]:
            - row [ref=f4e253]:
              - cell [ref=f4e254]:
                - code [ref=f4e255]: unique_postings
              - cell "The number of unique (de-duplicated) monthly active job postings that match your filters. A posting is counted once for each month it is active." [ref=f4e256]
            - row [ref=f4e257]:
              - cell [ref=f4e258]:
                - code [ref=f4e259]: duplicate_postings
              - cell "Job postings are often posted multiple times and in multiple places online. Lightcast de-duplicates these postings to get the \"unique_postings\" (see above) but also provides \"duplicate_postings\", which is the number of duplicate monthly active job postings for a given query." [ref=f4e260]
            - row [ref=f4e261]:
              - cell [ref=f4e262]:
                - code [ref=f4e263]: total_postings
              - cell "The sum of \"unique_postings\" and \"duplicate_postings\" is the total number of postings found online." [ref=f4e264]
            - row [ref=f4e265]:
              - cell [ref=f4e266]:
                - code [ref=f4e267]: posting_intensity
              - cell "The number of total job postings divided by the number of unique (de-duplicated) job postings." [ref=f4e268]
            - row [ref=f4e269]:
              - cell [ref=f4e270]:
                - code [ref=f4e271]: significance
              - cell [ref=f4e272]:
                - emphasis [ref=f4e273]:
                  - text: This metric can only be used to rank
                  - code [ref=f4e274]: by
                  - text: a facet in a ranking request, it cannot be used as a totals metric, or an extra ranking metric.
                - text: The relative concentration of each ranked item based on your filters as compared to all available postings in the filtered timeframe. Larger scores mean these ranked items occur more frequently in your filtered job postings than in all other postings in the filtered timeframe.
            - row [ref=f4e275]:
              - cell [ref=f4e276]:
                - code [ref=f4e277]: relevance
              - cell [ref=f4e278]:
                - emphasis [ref=f4e279]:
                  - text: This metric can only be used to rank skill facets in a ranking or ranking-timeseries request; it cannot be used as a totals metric, an extra ranking metric, nested ranking, or ranking distribution. Relevance requires at least one filter besides
                  - code [ref=f4e280]: when
                  - text: .
                - text: A smoothed NPMI association score from
                - code [ref=f4e281]: "-1"
                - text: to
                - code [ref=f4e282]: "1"
                - text: between a skill and the filtered posting set. Unlike
                - code [ref=f4e283]: significance
                - text: "'s relative-concentration score, relevance is normalized and directly expresses association strength."
            - row [ref=f4e284]:
              - cell [ref=f4e285]:
                - code [ref=f4e286]: unique_companies
              - cell "The number of unique companies represented in your filtered set of postings." [ref=f4e287]
            - row [ref=f4e288]:
              - cell [ref=f4e289]:
                - code [ref=f4e290]: median_salary
              - cell "The median annual salary advertised on job postings." [ref=f4e291]
            - row [ref=f4e292]:
              - cell [ref=f4e293]:
                - code [ref=f4e294]: average_salary
              - cell "The average annual salary advertised on job postings." [ref=f4e295]
            - row [ref=f4e296]:
              - cell [ref=f4e297]:
                - code [ref=f4e298]: min_salary
              - cell "The minimum annual salary advertised on job postings." [ref=f4e299]
            - row [ref=f4e300]:
              - cell [ref=f4e301]:
                - code [ref=f4e302]: max_salary
              - cell "The maximum annual salary advertised on job postings." [ref=f4e303]
            - row [ref=f4e304]:
              - cell [ref=f4e305]:
                - code [ref=f4e306]: median_posting_duration
              - cell "The median duration of closed job postings that match your filters. Duration is measured in days." [ref=f4e307]
            - row [ref=f4e308]:
              - cell [ref=f4e309]:
                - code [ref=f4e310]: median_years_of_experience_required
              - cell "The median experience required, based on job postings that include both a minimum and maximum requirement." [ref=f4e311]
        - text: ⚠️ Internal Only
        - paragraph [ref=f4e312]: Information about facet limitations in this API are listed below.
        - table [ref=f4e313]:
          - rowgroup [ref=f4e314]:
            - row [ref=f4e315]:
              - columnheader "Facet" [ref=f4e316]
              - columnheader "Definition" [ref=f4e317]
          - rowgroup [ref=f4e318]:
            - row [ref=f4e319]:
              - cell [ref=f4e320]:
                - code [ref=f4e321]: sources
              - cell [ref=f4e322]:
                - emphasis [ref=f4e323]: This facet can only be ranked
                - code [ref=f4e324]: by
                - text: "\"unique_postings\""
                - emphasis [ref=f4e325]: in a ranking, nested ranking, or ranking timeseries query.
                - text: The job boards that the postings were found on.
        - text: ⚠️ Internal Only
        - heading "/status" [level=2] [ref=f4e326]:
          - link:
            - /url: "#status"
          - text: /status
        - paragraph [ref=f4e327]: Service status (health)
        - heading "GET /status" [level=3] [ref=f4e328]:
          - link:
            - /url: "#get-status"
          - generic [ref=f4e329]: GET
          - text: /status
        - paragraph [ref=f4e330]:
          - text: Get the health of the service. Be sure to check the
          - code [ref=f4e331]: healthy
          - text: attribute of the response, not just the status code. Caching not recommended.
