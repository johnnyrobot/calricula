services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: calricula-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calricula
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: calricula-backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/calricula
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_FILE_SEARCH_STORE_NAME=${GEMINI_FILE_SEARCH_STORE_NAME:-calricula-knowledge-base}
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_JWKS_URL=${OIDC_JWKS_URL}
      - AUTH_LEGACY_RELINK=${AUTH_LEGACY_RELINK:-true}
      - AUTH_DEV_MODE=${AUTH_DEV_MODE:-false}
      - BLS_API_KEY=${BLS_API_KEY}
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # @johnnyrobot/workspace-ui is a private GitHub Packages dependency; the
      # build reads a `read:packages` token from ./.npm_token (gitignored) as a
      # BuildKit secret. See docs/APPLICATIONX-EMBED.md.
      secrets:
        - npm_token
    container_name: calricula-frontend
    environment:
      - NODE_ENV=development
      - API_URL=http://backend:8000
      - API_BASE_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8001
      - NEXT_PUBLIC_LOGTO_ENABLED=${NEXT_PUBLIC_LOGTO_ENABLED:-false}
      - LOGTO_ENDPOINT=${LOGTO_ENDPOINT}
      - LOGTO_APP_ID=${LOGTO_APP_ID}
      - LOGTO_APP_SECRET=${LOGTO_APP_SECRET}
      - LOGTO_COOKIE_SECRET=${LOGTO_COOKIE_SECRET}
      - LOGTO_BASE_URL=${LOGTO_BASE_URL:-http://localhost:3001}
      - LOGTO_API_RESOURCE=${LOGTO_API_RESOURCE}
      - LOGTO_APPLICATIONX_RESOURCE=${LOGTO_APPLICATIONX_RESOURCE}
      - NEXT_PUBLIC_AUTH_DEV_MODE=${NEXT_PUBLIC_AUTH_DEV_MODE:-false}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3000"
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:

networks:
  default:
    name: calricula-network

secrets:
  # Build-time only: GitHub token with `read:packages` (never committed).
  npm_token:
    file: ${NPM_TOKEN_FILE:-./.npm_token}
