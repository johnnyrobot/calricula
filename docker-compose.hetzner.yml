services:
  calricula-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: calricula-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Logto / OIDC (ADR-0001) -- see docs/AUTH-LOGTO.md. Values come from
      # .env via env_file above; listed here for visibility.
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_JWKS_URL=${OIDC_JWKS_URL}
      - AUTH_LEGACY_RELINK=${AUTH_LEGACY_RELINK:-true}
    volumes:
      - calricula_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - proxy

  calricula-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=https://calricula.com
        - NEXT_PUBLIC_LOGTO_ENABLED=${NEXT_PUBLIC_LOGTO_ENABLED:-false}
    container_name: calricula-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      - API_URL=http://calricula-backend:8000
      - API_BASE_URL=http://calricula-backend:8000
      - LOGTO_ENDPOINT=${LOGTO_ENDPOINT}
      - LOGTO_APP_ID=${LOGTO_APP_ID}
      - LOGTO_APP_SECRET=${LOGTO_APP_SECRET}
      - LOGTO_COOKIE_SECRET=${LOGTO_COOKIE_SECRET}
      - LOGTO_BASE_URL=${LOGTO_BASE_URL:-https://calricula.com}
      - LOGTO_API_RESOURCE=${LOGTO_API_RESOURCE}
      - LOGTO_APPLICATIONX_RESOURCE=${LOGTO_APPLICATIONX_RESOURCE}
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - proxy

volumes:
  calricula_uploads:

networks:
  proxy:
    external: true
